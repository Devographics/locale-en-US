locale: en-US
translations:
  - key: general.devs2026.survey_intro
    t: |

      Last year's first-ever State of Devs survey covered career, workplace, health, and even worldview issues that are often left unadressed in the developer community. 

      And it only made sense to follow up with this second edition about all the aspects of a developer's life that are *not* code, especially at a time where AI has started disrupting the very nature of our jobs. 

      So while there's still a human in the loop, let's leave aside libraries and frameworks and just check in: how are you doing, *really*?

      As usual, every question is optional, so feel free to skip any that you don't feel comfortable answering.

  - key: introduction.devs2026
    t: |

      This might be remembered as the year when AI became too big to ignore. It's getting harder and harder to dismiss it as “smart autocorrect” or make fun of the spaghetti code it vibe-codes. And its influence is being felt in every layer of society. 


      This is why I decided to dedicate an entire section to asking developers not just whether they're using AI, but how they *feel* about using AI–which is another matter altogether. 


      I also added a brand new feature: **correlations**, accessible through little red and yellow grid icons throughout the survey. These point the way towards interesting paths to dig further into the data, which you can then further explore using the **Query Builder**. 


      But of course, the usual warning applies: correlation is most definitely not causation, and the audience sampled by this survey might not always be representative of the entire developer population. 


      With those caveats out of the way, please discover the 2026 State of Devs survey results!


      <span class="conclusion__byline">– Sacha Greif</span>

  - key: general.devs2026.css2025_banner
    t: |
      Take the State of CSS survey and test your CSS knowledge! →

  # FAQ

  - key: faq.how_long_will_survey_take_devs2026
    t: How long will this survey take me?
  - key: faq.how_long_will_survey_take_devs2026.description
    t: >
      This survey should take about 15 minutes to complete. Note that all questions are optional.

  - key: faq.results_released_devs2026
    t: When will the results be released?
  - key: faq.results_released_devs2026.description
    t: The survey will run from July 5 to September 5, 2026, and the survey results will be released shortly after.

  - key: faq.survey_design_devs2026
    t: How was this survey designed?
  - key: faq.survey_design_devs2026.description
    t: >
      This survey was designed as the results of an [open design process](https://github.com/Devographics/surveys/issues/288) involving the web development community.

  ###########################################################################
  # Takeaways
  ###########################################################################

  # user_info

  - key: sections.user_info.description.devs2026
    t: 5,463 developers took part in this second edition of the State of Devs survey.

  - key: user_info.country.takeaway.devs2026
    t: |
      It's no secret that **U.S.** developers tend to earn higher salaries, and the data once again confirms this trend. 

      But while U.S. respondents earn a lot, they also work a lot. On the other hand, the **United Kingdom**, **Norway** and **Denmark** stand out as ranking in the top 10 for both highest income and fewest hours worked. 

      Note that this year we additionally asked respondents for their country of *origin*, although no big differences were observed.

  - key: user_info.country_of_origin.takeaway.devs2026
    t: |
      Respondents' country of origin tends to match their country of residence fairly closely.

  - key: user_info.migration_experience.takeaway.devs2026
    t: |
      Looking at immigration experience reveals that respondents who have immigrant parents or are immigrants themselves tend to earn significantly more (although speculating on the causes of this correlation is beyond the scope of this survey).

      And while **Japan** shows the highest immigration levels among respondents, this is almost certainly due to the survey failing to reach the native Japanese population more than to any real demographic trend. 

      On the other hand, despite being known as “a nation of immigrants”, only 17% of respondents from the **U.S.** have immigrant roots, versus 22% overall.

  - key: user_info.native_languages.takeaway.devs2026
    t: |
      When comparing the lists of native languages (tab 1) and languages learned later on (tab 2), one entry stands out: while only 20 respondents speak Japanese natively, 140 of them have learned it, reflecting the country's strong cultural pull.

  # - key: user_info.other_languages.takeaway.devs2026
  #   t: |
  #     TODO

  - key: user_info.gender.takeaway.devs2026
    t: |
      Looking at the data reveals that while most factors are not strongly correlated with gender, a few key areas definitely *are*. 

      For example, men tend not to experience workplace discrimination as much, and are also much more likely to identify as straight/heterosexual.

  - key: user_info.sexual_orientation.takeaway.devs2026
    t: |
      Sexual orientation is an area that lacks both data and representation in the developer community, and for that reason we decided to add it to the survey this year.

      Straight/heterosexual respondents are more likely to identify as **right-wing**, and less likely to experience **neurodivergent conditions**, while both gay/lesbian and bisexual groups are more likely to be worried about **rising intolerance** as a global issue.

  - key: user_info.race_ethnicity.takeaway.devs2026
    t: |
      As one might expect, race is strongly correlated with native language (note that Country and Country of Origin are automatically filtered out here).

      Another correlation worth pointing out: **white** respondents are more likely to be older and have more years of programming experience, which has been a recurring finding since tracking this datapoint.

  - key: user_info.relationship_status.takeaway.devs2026
    t: |
      As one might expect, married respondents have more children–but not that much more. With an average of only **0.9** children, even married couples are far below the often-cited 2.1 children population replacement rate.

  - key: user_info.number_of_kids.takeaway.devs2026
    t: |
      The global fertility collapse is in full display in this dataset, with families with 4 kids or more accounting for less than 2% of respondents.  

      One cause is that respondents are waiting to have children later in life (the average number of children in the 20-29 age bracket is a mere **0.07**), resulting in a much shorter window before the eventual biological cutoff.

  # career

  - key: sections.career.description.devs2026
    t: Your career and work experience up to now.

  - key: career.years_of_experience.takeaway.devs2026
    t: |
      Junior developers did not participate in the survey as much this year around, with only 9% of respondents having 4 years of professional experience or less. 

      It will be interesting to see how this AI-native generation of developers evolves going forward, but for now at least the vast majority of respondents had their professional start in a pre-AI world.

  - key: career.how_many_jobs.takeaway.devs2026
    t: |
      Looking at correlations for this question reveals a strong correlation for having worked for more employers, and reporting more workplace issues. 

      While this could simply be due to respondents experiencing more issues over time, another factor could also be junior hires lacking the perspective to identify problematic behaviors in the first place.

  - key: career.employment_status.takeaway.devs2026
    t: |
      While 53% of company employees have seen their income increase over the past year, freelancers on the other hand have not been so lucky, with only 32% of them seeing a positive evolution.

  - key: career.career_issues.takeaway.devs2026
    t: |
      Apart from **job insecurity** itself, **discrimination** stands out as the issue most likely to make respondents think they'll have to change jobs in the near future. 

      It's also interesting to see how factors such as **gender** can affect workplace issues. For example, while men reported **4.2** different issues on average, women and non-binary respondents checked **4.8** items.

  - key: career.discrimination_issues.takeaway.devs2026
    t: |
      **Age** is the most commonly reported discrimination factor, but looking at the additional comments left by respondents, it seems it can cut both ways: respondents mentioned both being overlooked for looking too young, and discounted for being too old.

      It's also worth pointing out that discrimination can have many forms, and sometimes even pro-diversity initiatives can have negative impacts on the people they're meant to help. As one respondent pointed out, “beinging the token woman is exhausting. I'm expected to be in employer marketing material and provide opinions on all things DEI without compensation”.

      Finally, picking more items for this question is correlated with experiencing more **ongoing health issues**, which is another reminder that workplace issues do not happen in a vacuum.

  - key: career.negative_impacts.takeaway.devs2026
    t: |

      While 33% of male respondents declared never having to take any action in response to workplace issues, that figure falls to 18% when looking at non-men. 

      Across the board, the most common responses are **avoiding colleagues**, **changing your own behavior**, or simply **resigning**. But no matter which strategy respondents adopted, these were all reported at higher rates among non-men.

  - key: career.laid_off.takeaway.devs2026
    t: |

      While the majority of respondents have never been laid off, we can see affirmative responses slowly creep up compared to last year (with the usual caveat that this could also be due to the respondent pool chaning from year to year).

  - key: career.job_security.takeaway.devs2026
    t: |

      While AI anxiety and industry burnout play a part here, for now at least traditional workplace issues are still the main factors making respondents worry for their jobs.

  - key: career.career_security.takeaway.devs2026
    t: |

      Most respondents still consider a forced career change unlikely, which shows developers don't quite buy the narrative that they'll soon find themselves replaced with AI, and forced to work the land for their subsistence–at least not just yet.

  # workplace

  - key: sections.workplace.description.devs2026
    t: Your current workplace.

  - key: workplace.company_size.takeaway.devs2026
    t: |

      While working for larger companies remains correlated with earning more and seeing your income increase, it's also interesting to look at what happens when you don't work for a company at all. 

      In addition to working fewer hours per week, freelancers also reported lower AI usage and more negative attitudes towards AI in general, pointing to a possible solution for those seeking an alternative path–at the cost of lower revenues.

  - key: workplace.job_title.takeaway.devs2026
    t: |

      Carrying the “engineer” still comes with an income premium compared to being “just” a developer.

      We can also see front-end development still makes up the bulk of the work, which makes sense given the web-centric focus of the survey's audience.

  - key: workplace.work_areas.takeaway.devs2026
    t: |

      Plotting work areas against average yearly income and average years of experience reveals a fairly strong correlation between the two. 

      Yet a few areas (such as **AI** and **platform** engineering, and **hiring/interviewing**) sit above the trendline, meaning they correlate with higher incomes than what you'd normally expect to see.

  - key: workplace.yearly_salary.takeaway.devs2026
    t: |

      The three strongest predictors of a high income continue to be having **more experience**, working for a **larger company**, and being located in the **U.S.**.

  - key: workplace.income_evolution.takeaway.devs2026
    t: |

      While the U.S. does offer the highest salaries, it only ranks 11th when looking at countries with the highest proportion of *increasing* income. Instead, the top 10 is largely made up of Nordic countries and their neighbors, which could presage a reshuffle of the salary rankings in the coming years.

  - key: workplace.job_finding_application_count.takeaway.devs2026
    t: |

      Finding a new job is always a challenge, but thankfully it's one that gets easier over the years, as more experienced developers needed fewer tries on average to get hired.

  - key: workplace.job_finding_methods.takeaway.devs2026
    t: |

      Interestingly, the data shows that finding your job through open-source or community work leads to a 39% income premium compared to the overall median. 

      And when it comes to effectiveness, generic job-finding methods such as LinkedIn or job boards require submitting more applications than going through your own personal network, or even applying to a company directly.

  - key: workplace.remote_work_policy.takeaway.devs2026
    t: |
      Lack of remote work is correlated with both lower median income and lower job satisfaction. And larger organizations seem to have a harder time transitioning to remote work, with the median number of employees being only **35** when looking at fully-remote companies.

  - key: workplace.work_hours_per_week.takeaway.devs2026
    t: |

      While it may look like working more means earning more, income varies much more due to other confounding factors (years of experience, company size, etc.) than due to sheer amount of time spent at work.

      In fact, if we isolate U.S. developers with 10-14 years of experience in order to eliminate those factor's influence, we see that the correlation between work hours and salary all but disappears.

  - key: workplace.job_happiness.takeaway.devs2026
    t: |

      While the majority of developers remain happy about their job, the data does show a slight increase in unhappy respondents compared to last year (white striped bars).

  - key: workplace.workplace_perks.takeaway.devs2026
    t: |

      Once again **coworker relationships**, **work-life balance**, and overall **working conditions** rank far higher than raw **compensation**.

  - key: workplace.workplace_difficulties.takeaway.devs2026
    t: |
      **Poor management** was a write-in answer last year, and adding it as part of the official selectable items in this edition made it shoot straight to the top as the workplace difficulty respondents struggle with the most.

  - key: workplace.workplace_burnout.takeaway.devs2026
    t: |
      This question's response items were inspired by [common signs of burnout](https://www.mayoclinic.org/healthy-lifestyle/adult-health/in-depth/burnout/art-20046642), and with respondents selecting **4.5** items on average it's fair to say this is a problem that affects a lot of us.

  - key: workplace.keyboard.takeaway.devs2026
    t: |

      Mechanical keyboards are having a bit of a moment, but many developers are still fine with the default laptop keyboard.

  - key: workplace.monitors.takeaway.devs2026
    t: |

      Having two monitors may be the norm, but a sizeable minority still manages to survive with just one.

  # ai
  - key: sections.ai_usage.description.devs2026
    t: AI Views

  - key: ai_usage.ai_generated_code_balance.takeaway.devs2026
    t: |
      There might be small pockets of AI resistance here and there (see this year's [State of CSS](https://2026.stateofcss.com/en-US/usage/#css_ai_generated_code_balance) data), but in 2026 the median developer is firmly in the AI era, with developers who write almost all their code through AI representing the largest single segment.

  - key: ai_usage.ai_sentiment.takeaway.devs2026
    t: |

      Reducing the AI question to a pro-/anti- spectrum might feel simplistic, but the resulting data still reveals interesting insights. 

      For example, not only does how you feel about AI predict how you feel about tech overall, but it also carries a strong correlation with other factors such as where you stand on the **political spectrum**, with pro-AI respondents leaning more **right-wing**.

  - key: ai_usage.ai_risks.takeaway.devs2026
    t: |

      **Environmental impact** tops the rankings when it comes to AI concerns, and just like other environmental issues it seems like it has become politicized, with a strong correlation with identifying as more left-wing.

  - key: ai_usage.ai_management_pressure.takeaway.devs2026
    t: |

      Beyond AI's actual usefulness to developers, companies also play a big role in encouraging the technology's increased usage.

      But this AI enthusiasm is not without downsides: being too heavy-handed with measures such as quotas or leaderboards can have negative consequences on **job happiness** and employee **mental state**.

  - key: ai_usage.ai_mental_state.takeaway.devs2026
    t: |

      AI tools might make us more productive, but they don't seem to be making us happier. While many remain neutral, a sizeable chunk of respondents deplored a negative impact on their mental state, correlated with feeling **exhausted** and *disillusioned** about the tech industry overall. 

      Meanwhile, the most prevalent emotions among those who report a positive mental impact was **curiosity**–although even within that group, feeling **overwhelmed** was still quite common.

  - key: ai_usage.ai_outlook.takeaway.devs2026
    t: |
      TODO

  # health
  - key: sections.health.description.devs2026
    t: Health & fitness.

  - key: health.age.takeaway.devs2026
    t: |
      Age is one of the key *confounding factors* in the dataset. In other words, it can make it seem like two other variables (such as “number of kids” and “yearly income”) have some kind of stronger relationship, when they are actually both downstream from a common root cause. 

      One unexpected finding is that while older respondents tend to generate less of their code using AI, they also tend to view the technology more positively.

  - key: health.disability_status.takeaway.devs2026
    t: |

      Gender and age have a big impact on the type of disabilities respondents experience, with **hearing impairments** and **chronic illness** becoming more common with age.

      And confirming [other studies](https://www.bmj.com/content/385/bmj.q999), chronic illness is more present among women; while **neurodivergent conditions** and **mental health issues** are over-represented among non-binary respondents.

  - key: health.health_issues.takeaway.devs2026
    t: |

      Poor sleep continues to be the top health issue affecting respondents.

      When looking at health issues across countries, the “healthiest” countries (based on the proportion of respondents who reported experiencing no health issues whatsoever) were Italy, Norway, and Switzerland.

      But of course, what gets reported as a health issue or not can also be in part cultural, with for example only **8%** of Russia-based respondents reporting mental health issues, significantly lower than the 12% figure for all survey respondents.

  - key: health.sleep_quantity.takeaway.devs2026
    t: |

      While lack of sleep is a prevalent health issue, the actual number of sleep hours is remarkably consistent across the dataset, with **91%** of respondents sleeping between 6 and 8 hours per night, even if it does decrease slightly with age.

  # worldview

  - key: sections.worldview.description.devs2026
    t: Worldview, politics, and current events.

  - key: worldview.global_issues.takeaway.devs2026
    t: |

      It's not surprise that European countries that just experienced one of the most violent heatwave ever felt in the region all cited **climate change** as a top concern. 

      Yet another big worry is **rising authoritarianism**, especially in countries such as Sweden, the U.S., France, and Germany which all have far-right parties close to (or in) power. 

      Age also plays a role here, with younger respondents being more concerned about **geopolitical tensions**.

      And as expected, many of these issues follow a sharp political divide: worry about **climate change** drops sharply once you cross the centerline of the political spectrum, being instead replaced by things such as **geopolitical tensions**, the **erosion of traditional values**, and **lack of free speech**.

  - key: worldview.political_expression_at_work.takeaway.devs2026
    t: |

      While free speech is protected in most countries, that doesn't always translate into feeling comfortable enough to express your opinions, as shown by the fact that the **U.S.** comes in 17th place here. 

      What's also interesting is that right-wing respondents are overall less comfortable expressing their political opinions at work.

  - key: worldview.workers_union.takeaway.devs2026
    t: |

      At a time where tech industry job security is being threatened by AI, worker's unions may offer a way to give employees some of the power back- although this idea seems far more popular on the left than on the right.

      Looking at countries, **Sweden** stands out as the only country where a majority of respondents already belong to a union, while the **U.S.** actually comes in first when looking at respondents who are not currently part of an union, but would like to join one.

  - key: worldview.political_spectrum.takeaway.devs2026
    t: |

      Reducing an individual's political leanings to a  left-right spectrum is admittedly a bit simplistic; furthermore, the exact same opinions may register as right-wing in one country, and left-wing in another.

      But it's still interesting to see how respondents identify, and which factors are correlated with being more left-wing (worrying about rising intolerance and climate change) and right-wing (being concerned about the erosion of traditional values, and being pro-AI).

  - key: worldview.tech_industry_emotion.takeaway.devs2026
    t: |

      Respondents are not feeling great about the tech industry in 2026, with negative emotions topping the list, chief among them **exhaustion** and *disillusionment**. 

      And while **curiosity** does come in third overall, it's also correlated with other aspects of a respondent's worldview, such as being more pro-AI or leaning further to the right politically.

  - key: worldview.happiness_factors.takeaway.devs2026
    t: |
      **Good health** remains the most important source of happiness worldwide. Age also reveals another pattern: as respondents get older, **friendships** and **hobbies** tend to give way to **family** as sources of happiness.

  - key: worldview.relocation.takeaway.devs2026
    t: |

      **Japan** and **Canada** remain the most popular places respondents would like to move to if given the chance. 

      The **U.S.**, long considered the most attractive destination for tech workers, only comes in 5th (when excluding respondents who already live there). Political factors might play a role, as shown by correlations with **right-wing leanings** and **pro-AI sentiment**.

  - key: worldview.overall_happiness.takeaway.devs2026
    t: |

      At the end of the day, a lot of our happiness comes down to having a good, secure job, and being healthy, both physically and mentally. 

      Yet AI is threatening developers on both fronts, contributing to stress and exhaustion while putting job security in jeopardy, which translates into more unhappy respondents compared to 2025.

    aliases:
      - happiness.overall_happiness.takeaway.devs2026

  # hobbies

  - key: sections.worldview.description.devs2026
    t: Worldview, politics, and current events.

  - key: hobbies.hobbies.takeaway.devs2026
    t: |

      While we all say we should to read more, **women** and **over-60** respondents are two segments where the hobby actually comes in first. 

      Meanwhile, **video games** top the chart, followed by **movies and TV**.

  - key: hobbies.physical_activity.takeaway.devs2026
    t: |

      When it comes to physical activity, looking at different countries reveals very different preferences. 

      While 30% of **Israeli** respondents practice **strength training**, that number drops to 12% for **France**. Meanwhile, the relatively flat **Netherlands** still leads the rankings when it comes to **climbing**.

  - key: hobbies.favorite_beverages.takeaway.devs2026
    t: |

      With one of the world's most popular programming languages named after a type of coffee, it's no surprise to see the popular beverage rank at the top.

  - key: hobbies.favorite_books.takeaway.devs2026
    t: |

      **Dungeon Crawler Carl** is without a doubt the standout title from this year's rankings–but the whole list is worth checking out to find your next read!

  - key: hobbies.favorite_video_games.takeaway.devs2026
    t: |

      **Clair Obscur: Expedition 33** earns a well-deserved first place to dethrone **Baldur's Gate 3** as this year's most popular game.

  - key: hobbies.video_game_platforms.takeaway.devs2026
    t: |

      While **PC gaming** remains first, the **Switch** (both 1 and 2) continues to demonstrate impressive staying power.

  # metadata

  - key: _user.metadata.source.takeaway.devs2026
    t: |

      TODO

      While a majority of respondents came from our existing audience and mailing list, **Josh Comeau** mentioning the survey in his newsletter was also a big boost. 

      When looking at the gender breakdown for each source, [snowball sampling](https://github.com/Devographics/surveys/issues/258) proved quite effective at driving more women to participate in the survey, as was sponsoring creators such as [Cassidy Williams](https://cassidoo.co/), who featured the survey in her weekly newsletter.
    aliases:
      - user.metadata.source.takeaway.devs2026

