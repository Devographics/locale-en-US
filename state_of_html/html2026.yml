locale: en-US
translations:
  ###########################################################################
  # General
  ###########################################################################

  - key: general.results.description.html2026
    t: The 2026 edition of the annual survey about the latest trends in the HTML ecosystem.

  - key: general.html2026.survey_intro
    t: |
      The eldest among you might remember the ancient times of the late 2020s, when JavaScript libraries ruled the land and it wasn't uncommon to see a developer install an entire front-end framework just to show a modal window or submit a form.

      Yet just a few short years later, we're now in a whole new era. AI is outputting a lot–if not most–of our code, and agents are perfectly capable of hand-picking the best browser API for your specific need without having to import an entire framework. Which makes the web platform's native features more relevant than ever. 

      But even though AI is making us more productive, it's not making us any less busy. Which is why we've tried to keep this year's survey's length under control, removing quite a few features and questions to ensure you can fill it out in 15 minutes or less. 

      And as always, this year's results will be taken in consideration by browser vendors to prioritize their roadmaps, meaning that your participation can help shape the future of the web.

  - key: features.features_intro_html2026
    aliasFor: features.features_intro_html2024

  - key: introduction.html2026
    t: |
      For what seemed like eons, it felt like the web was standing still. Web APIs were limited compared to their native equivalents. Building anything more complex that a single-column layout required lots of hacks, duct tape, and swearing. 


      As a result, JavaScript came in to fill the void, and we witnessed a literal explosion of frameworks, libraries, and everything in-between.


      But these days, things have flipped. JavaScript frameworks have consolidated around a couple solid options, and the pace of change has slowed down. Meanwhile, browser vendors have finally gotten their act together and are now working hand-in-hand to release new features faster than ever before–and ensure they work across the board!


      And this is happening just in time for the widespread adoption of AI-assisted code generation, which has no qualms about skipping JavaScript frameworks altogether and leveraging browser APIs directly when it makes sense.


      So this feels like the perfect time to go back to basics and brush up on what modern browsers can actually do. And this survey is here to help!


      <span class="conclusion__byline">– Sacha Greif</span>

  - key: faq.survey_design_html2026
    t: How was this survey designed?
  - key: faq.survey_design_html2026.description
    t: >
      This survey was designed as the results of an [open design process](https://github.com/Devographics/surveys/issues/253) involving browser vendors and the web development community.

  - key: faq.results_released_html2026
    t: When will the results be released?
  - key: faq.results_released_html2026.description
    t: The survey will run from October 1 to November 1, 2026, and the survey results will be released around November 15, 2026.

  ###########################################################################
  # Figures
  ###########################################################################

  - key: figure.figure_lazy_loading_usage.html2026
    t: Proportion of respondents having used **lazy loading**, the most-used feature among those with the “Newly Available” Baseline status.

  - key: figure.figure_content_security_usage.html2026
    t: Largest year-over-year usage increase, for **Content-Security Policy**.

  - key: figure.figure_forms_features.html2026
    t: Number of comments on the most-commented feature, **datalist**.

  ###########################################################################
  # Highlights
  ###########################################################################

  - key: highlight.customizable_select.html2026
    t: |
      **Customizable Select** may not currently be widely supported, yet it's a feature worth knowing about. While only used by **7.1%** of respondents, **89%** of developers who *have* used it report a positive experience. 

      And given that the `<select/>` element has always been a challenge to style, being able to finally customize it to your needs without resorting to JavaScript-based hacks is a welcome improvement!

  - key: highlight.jpeg_xl.html2026
    t: |
      After the "JIF/GIF" pronunciation fiasco and the confusingly-named "PNG" ("pee-en-gee"? "ping"?), whoever's in charge of image format nomenclature decided to keep things simple this time: take the already-popular JPEG and add an “XL” to it to make it cooler. 

      But not bigger though, as contrary to their name JPEG XL images are actually *smaller* than boring old JPEG–while somehow also being backwards-compatible with it. Don't ask me how that works.

  - key: highlight.hidden_until_found.html2026
    t: |
      Did you know that browsers can now play hide-and-seek? The `hidden="until-found"` attribute lets you hide an element until the user triggers it, by (for example) clicking an anchor link pointing to it.

      Right now the feature is definitely in its “hidden” state, with **79.4%** of respondents having never even heard about it before. And browser support is still sparse (looking at you, Safari!). But once interoperability improves, it might just turn out to be worth adding to your toolbelt.

  - key: highlight.popover_api.html2026
    t: |
      The **Popover API** is “Newly Available” as of this year, meaning it's now supported in all four major browsers. Which makes this the perfect time to learn how it can help you get rid of hacky JavaScript code, and replace it with a nice declarative API!

  - key: highlight.blocking_render.html2026
    t: |
      Those of us who give a FOUC (Flash of Unstyled Content) about controlling how websites load will be happy to learn about `blocking="render"`. As it name implies, this attribute can make a `<link>`, `<script>` or `<style>` tag block the page's rendering until they're fully loaded.

      Browser support isn't quite there yet–but it's definitely something that will make web loading UX much smoother once it becomes widely supported.

  - key: highlight.element_internals.html2026
    t: |
      If you write web components, you must have often needed to specify custom pseudo-classes, default ARIA parameters, or to make a component behave like a regular form element?

      **ElementInternals** does all that, and more! The best part? It’s Widely Available, supported by all browsers since 2023!

  - key: highlight.payment_request_api.html2026
    t: |
      “My favorite carrot cake recipe? Sure, I'll tell you! But first, can I interest you in a new mattress? Or maybe some shoes?”. 

      Ads can seem like an inescapable part of the web, especially when you're trying to bake a new pastry. But the **PaymentRequest API** could be the first step towards making browser-integrated micro-payments a reality. And that fact alone makes it worth keeping an eye on.

  - key: highlight.search_element.html2026
    t: |
      The `<search>` element is one of those easy wins that take very little effort to add to your list of best practices. Step 1: use it to denote any search field in your apps. Step 2: well that's it really!

      And now that it's supported in all four major browsers, there's really no reason not to be using it.

  ###########################################################################
  # Takeaways
  ###########################################################################

  - key: features.all_features.takeaway.html2026
    t: >
      This table now supports filtering by [Baseline](https://web.dev/baseline) status, which is a handy way to see at a glance which features are now ready to use across all major browsers.

  - key: features.features_ratios_over_time.takeaway.html2026
    t: >
      Features that saw their usage increase include the afore-mentioned `datalist` (**+14%**), as well as `dialog` (**+15%**), the Popover API (**+19%**), and especially the very handy `<dialog.closedBy="any">` (**+20%**).


      Meanwhile, looking at awareness gives us some interesting insights into which features might explode in usage in the near future, such as File System Access (**+24%**).

  - key: forms.forms_features.takeaway.html2026
    t: |
      It's worth highlighting the `datalist` element, which saw a big year-over-year usage increase, going from **30%** to **44%**.


      Yet at the same time, positive sentiment fell from **44%** to **34%** (going from first place to 18th in the overall rankings).


      Respondent comments mention difficulties around styling, accessibility, and browser bugs, pointing to a post-release follow-through that didn't quite meet developer expectations–and showing once again that as a feature gets more usage, criticisms often also increase accordingly.

  - key: forms.forms_pain_points.takeaway.html2026
    t: |
      As with previous years, **Styling & customization** remains a major pain point when it comes to forms.

  - key: content.content_features.takeaway.html2026
    t: |
      Developers continue to love the **Sanitizer API**, with many comments lamenting its current lack of support in Safari.

  - key: content.content_pain_points.takeaway.html2026
    t: |
      Just like last year, **HTML reuse** generally, and native HTML templating support more specifically continue to be developers' biggest content-related pain-points.

  - key: interactivity.interactivity_features.takeaway.html2026
    t: |
      Overall, interactivity-related features continue to be grouped towards the top of the rankings when it comes to positive sentiment, with most developers having very few negative things to say about them.

  - key: interactivity.interactivity_pain_points.takeaway.html2026
    t: |
      Browser support was already a major issue last year, and this time around is no different.

  - key: performance.performance_features.takeaway.html2026
    t: |
      Just like last year, `srcset` and `sizes` attributes remain controversial because of their complex syntax.

  - key: performance.performance_pain_points.takeaway.html2026
    t: |
      As seen previously, image loading continues to be a sore spot, especially when it comes to handling multiple sizes.

  - key: web_components.web_components_features.takeaway.html2026
    t: |
      **Shadow DOM** may be a cool concept (with a cool name! but it remains a bit too complex to wrap your mind around for many developers.

  - key: web_components.web_components_pain_points.takeaway.html2026
    t: |
      A lack of clear use case remains an issue with Web Components, with many developers stating that they often fail to see a reason to reach for them.

  - key: system_capabilities.system_capabilities_features.takeaway.html2026
    t: |
      While many device features remain under-used, the fact that AI-assisted coding now makes it far easier to leverage miche APIs such as **WebUSB** or **Web Bluetooth** might unlock new uses for them in the future.

  - key: system_capabilities.system_capabilities_pain_points.takeaway.html2026
    t: |
      While **browser support** is slightly less of an issue compared to last year, it's still the top pain point when it comes to leveraging system and device capabilities.

  # a11y

  - key: accessibility.accessibility_features.takeaway.html2026
    t: |
      While the **tabindex** attribute is widely used, many respondents reported finding the API awkward and hard to read.

  - key: accessibility.accessibility_techniques.takeaway.html2026
    t: |
      It's heartening to see every accessibility technique mentioned here gain ground over the past year.

  - key: accessibility.accessibility_disabilities.takeaway.html2026
    t: |
      Now that the web platform provides more tools to target a more diverse set of user needs, it's up to us to start accounting for them during our development process.

  - key: accessibility.accessibility_screenreaders.takeaway.html2026
    t: |
      Once again, easily accessible tools like VoiceOver or the Chrome DevTools win over more specialized options.

  - key: accessibility.accessibility_tools.takeaway.html2026
    t: |
      At this point, it does seem like browser devtools have become the de facto gateway to good accessibility practices.

  - key: accessibility.accessibility_ai_impact.takeaway.html2026
    t: |
      You might think AI-assisted coding would hurt accessibility due to developers paying less attention to the actual code, but it turns out the opposite is true, with one important caveat. 

      As many commenters pointed out, you need to explicitly make accessibility one of your priorities to ensure the LLM produces accessible code. Which in the end, isn't that different from before!

  - key: accessibility.accessibility_pain_points.takeaway.html2026
    t: |
      The biggest hurdle to accessibility continues to be lack of access to good testing tools. But beyond technical issues, convincing companies to value accessibility appropriately also remains a challenge.

  # usage
  - key: usage.html_interoperability_features.takeaway.html2026
    t: |
      **Customizable select** is nearing the finish line, and developers can feel it, with only Firefox lacking support for the long-awaited feature. 


      Meanwhile, with the Popover API now being supported in all major browsers, we're the number of developers citing browser support as an obstacle to its adoption drop, as it should.

  - key: usage.html_functionality_features.takeaway.html2026
    t: |
      `<select>` scored 10% lower compared to last year, presumably due to the progress made on making it easier to style and customize. Which lets **date inputs** take the dubious honor of taking the lead as the feature with the most impactful limitations.

  - key: usage.html_missing_elements.takeaway.html2026
    t: |
      We still want native **datatables**, with tabs coming in a close second.

  - key: usage.html_styling_issues.takeaway.html2026
    t: |
      These rankings mainly confirm findings already seen in other questions: styling continues to be a big issue, especially when it comes to form elements. And at a time when CSS itself is making progress at an unprecented rate, not being able to leverage all this power when it comes to some of the most common parts of any given web UI is certainly frustrating.

  - key: usage.progressive_enhancement_priority.takeaway.html2026
    t: |
      Progressive enhancement has long been adopted as a key best practice of our industry, but as with many well-intentioned principles there's often a large gap between theory and practice. 


      In this case, a full 43% of respondents do not concern themselves with making their apps or sites work without JavaScript. While on the other end of the spectrum, it's a requirement for only 4%. 


      Which is a shame, as considering progressive enhancement a “high priority” was also correlated with employing more **accessibility techniques**.

  - key: usage.html_css_js_balance.takeaway.html2026
    t: |
      Our codebases still contain a lot of JavaScript (or TypeScript). But this could change, as browser expand their native capabilities to let HTML and CSS take over some of the jobs JavaScript is currently tasked with.

  - key: usage.ai_generated_code_balance.takeaway.html2026
    t: |
      It's interesting to compare how different segments of the web developer population score when it comes to AI usage.


      [State of Devs](https://2026.stateofdevs.com/en-US/ai/#ai_generated_code_balance) respondents scored a median of 63% of their code being AI-generated, quite a bit higher than the 50% seen here. Meanwhile, when it comes to [CSS code more specifically](https://2026.stateofcss.com/en-US/usage/#css_ai_generated_code_balance), the median was way lower at only 13%!

  - key: usage.ai_browser_apis.takeaway.html2026
    t: |
      Having the ability to avoid slow API calls and get AI features right in your browser is certainly intruiging, but at this point the appeal is still limited.

  - key: usage.html_pain_points_freeform.takeaway.html2026
    t: |
      While most respondents were already able to share their frustrations throughout the rest of the survey, the lack of native HTML includes or templating is something that was cited again here by a few people.

  ###########################################################################
  # Conclusion
  ###########################################################################

  - key: conclusion.html2026.kilian_valkhof.name
    t: Kilian Valkhof
  - key: conclusion.html2026.kilian_valkhof.bio
    t: Creator of Polypane
  - key: conclusion.html2026.kilian_valkhof
    t: >
      I don't know about you, but it feels like things are _happening_ in the base layer of the web. 


      ### New Capabilities


      Browsers are trialing new elements that let users grant  permissions (e.g. for using the camera) without requiring JavaScript. We're _so close_ to finally getting customizable select in all browsers, and other new form capabilities are cropping up: color, switch, `showPicker()` and perhaps even a new `rangegroup` element. And features like `<dialog>`, `<details>`, and the `popover` attribute are all making all our lives easier right now. 


      What makes a lot of these APIs so great to use is their declarative nature. Why make yourself responsible for a click handler when `command="show-modal" commandfor="dialog"` is much less code, and handles so much more? Looking at the survey results, many of us agree. Overwhelmingly the content and HTML element-related APIs get the most love. 


      Something else that's become apparent this year is that the “base layer” of the web doesn't have to mean the user-facing web. Features like speculation rules (declarative JSON), declarative WebMCP and even the `loading` and `fetchpriority` attributes can help the user agent make better decisions around data loading and interactions, and if done well, the user shouldn't even notice them. 


      ### Lingering Frustrations


      On the other hand, a bunch of features just don't seem like they're gaining that much traction with developers. Take `datalist`. The fancy suggestion box isn't something you can depend on even if it _feels_ like using it gives you "select with a search box". And things like WebUSB or SpeechRecognition are fun APIs, but their use cases are limited. And what about `<model>`? A whole element just to show static 3D model files? 


      And of course, browser differences remain an evergreen source of frustration, but it sure looks like the problem has shifted from browsers doing things differently to browsers simply not having caught up yet. 


      This year in particular it seems that how mobile OSes and their UI choices impact the web is the main sore spot. Mobile operating systems are comparatively immature: will we look back in another decade and consider this period to be similar to the early days of Firefox vs. IE?


      ### The Accessibility Story


      It's also very heartening to see that accessibility is a top concern for survey respondents. And for good reason. You can't have good accessibility without good HTML, or good HTML without accessibility. They're not the same, but they're intertwined. 


      Accessibility is multi-faceted and that makes it hard for developers to know if they're doing the right thing for _all_ users–and browsers have a role to play here to make figuring this out easier. 


      *Editor's note: check out Kilian's very own [Polypane](https://polypane.app/) for a browser that does just that!*


      ### What's Next?


      What is left on our actual wishlist? After customizable select finally lands, we'll want to customize everything form-related (let's agree to start with `datalist`, yeah?). 


      What about HTML includes? Over at [OpenUI](https://www.openui.com/), work is underway on things like tabs and `focusgroup`. Are app-like components now standard enough to become, well, standardized? Or will we shift to wanting HTML to take on more non-user-facing capabilities? Time will tell.


      Looking back at what Dr. Lea Verou [wrote last year](https://2025.stateofhtml.com/en-US/conclusion/), it seems that even though there haven't been huge leaps, we're definitely moving in the right direction as far as us devs are concerned. 


      Major pain points are simply gone with the broad support for `dialog` and `popover`, and customizable select will do the same for many a UI. HTML is the base layer of the web, so maybe it's not a bad thing to have it move more slowly and more deliberately. Our industry might be in turmoil, but I think our foundation is in good shape.

  - key: about.content.html2026
    t: |
      The 2026 State of HTML survey ran from July 19 to September 1 2026, and collected 6,223 responses. 

      The survey was primarily designed by [Lea Verou](https://lea.verou.me/), as well as collaboratively through [an open GitHub thread](https://github.com/Devographics/surveys/issues/253)

      The survey infrastructure is run by [Sacha Greif](https://sachagreif.com/), with help from a team of open-source contributors and consultants. 

      This year's logo and t-shirt were designed by [Christopher Kirk-Nielsen](http://chriskirknielsen.com/).

      ### Survey Goals

      This survey was created to identify upcoming trends in the web development ecosystem in order to help developers make technological choices. 

      As such, the survey is focused on anticipating what's coming over the next few years rather than analyzing what's popular now, which is why the features or technologies that are currently most widespread are not always included. 

      It should also be taken as a **snapshot of a specific subset of developers**, and is not meant to speak for the entire ecosystem. 

      The survey was openly accessible online and respondents were not filtered or selected in any way.

      ### Project Funding

      Funding from this project comes from a variety of sources:

      - **T-shirt sales**. 

      - **Sponsored links**: the links to recommended resources at the bottom of each page are provided by our partner [Frontend Masters](https://frontendmasters.com/).

      - **Other Funding**: [Google](https://www.google.com/) and [TokyoDev](https://www.tokyodev.com/) also funded work on the survey.

      ### Technical Overview

      You can find a more in-depth technical overview of how the surveys are run [here](https://dev.to/sachagreif/how-the-devographics-surveys-are-run-2023-edition-1p6a).
